version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - misspell
    - nilerr
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (net.Listener).Close
        - (net.PacketConn).Close
        - (*compress/gzip.Reader).Close
        - (*database/sql.DB).Close
        - os.Remove
        - os.RemoveAll
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose
          - errorlint
          - unconvert
      - linters:
          - staticcheck
        text: "QF1001:"

formatters:
  enable:
    - gofmt
